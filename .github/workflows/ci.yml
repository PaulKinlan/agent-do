name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel an in-progress run when a new commit lands on the same PR / branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Active LTS + Current. package.json declares engines >=20.
        node: ['20', '22', '24']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Type-check (tsc --noEmit)
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  evals:
    # Mock-tier evals are deterministic and free (no provider calls), so they
    # gate every PR. The live tier is opt-in locally via `npm run eval:live`.
    name: Evals (mock tier)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Run mock-tier evals
        run: npm run eval

  docs:
    # Catches typedoc regressions without paying for the 3-node matrix.
    name: API docs build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Build API docs (typedoc)
        run: npm run docs

  demos:
    # Demos import from 'agent-do' (resolved to the local build via a
    # `file:../../` dependency), so they are the only thing that exercises the
    # published export surface the way a real consumer does. Every demo sat
    # broken for months importing `createFileTools`, which stopped being
    # exported in #98 — nothing in CI noticed because nothing ran them.
    #
    # This is a credential-free smoke test: each demo must get past module
    # resolution and top-level setup, and fail on the missing API key. It
    # catches removed/renamed exports and top-level type errors. It does not
    # exercise the agent loop — that needs real keys and costs money.
    name: Demo smoke (no credentials)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install and build the library
        run: |
          npm ci
          npm run build

      - name: Smoke-run every demo
        env:
          # Ensure no key leaks in from the runner environment.
          ANTHROPIC_API_KEY: ''
          GOOGLE_GENERATIVE_AI_API_KEY: ''
          GOOGLE_API_KEY: ''
          GEMINI_API_KEY: ''
          OPENAI_API_KEY: ''
        run: |
          set -euo pipefail
          failed=0
          for dir in demos/*/; do
            [ -f "${dir}package.json" ] || continue
            name="$(basename "$dir")"
            echo "── ${name} ──"
            ( cd "$dir" && npm ci --silent )
            out="$(cd "$dir" && timeout 120 npx tsx index.ts </dev/null 2>&1 || true)"
            if printf '%s' "$out" | grep -q 'No provider API key found'; then
              echo "OK — ${name} initialised and stopped at the credential check."
            else
              echo "::error::Demo '${name}' failed before the credential check:"
              printf '%s\n' "$out" | head -20
              failed=1
            fi
          done
          exit "$failed"

  agent-guides-in-sync:
    # AGENTS.md and CLAUDE.md are the same document under two names (different
    # agent harnesses look for different filenames). They drifted silently once;
    # this keeps them byte-identical so neither can go stale unnoticed.
    name: AGENTS.md == CLAUDE.md
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compare agent guides
        run: |
          if ! cmp -s AGENTS.md CLAUDE.md; then
            echo "::error::AGENTS.md and CLAUDE.md must be byte-identical. Run: cp AGENTS.md CLAUDE.md"
            diff -u AGENTS.md CLAUDE.md || true
            exit 1
          fi
          echo "OK — agent guides are in sync."

  require-changeset:
    # Enforces the documented release discipline (README / AGENTS.md):
    # a PR that changes the *shipping surface* must add a changeset.
    #
    # Shipping surface = src/ (runtime/types) OR a shipping-relevant key in
    # package.json (exports/bin/files/engines/main/types/module/dependencies/
    # peerDependencies/peerDependenciesMeta). Pure dev-tooling changes —
    # scripts, devDependencies bumps — are intentionally NOT gated, matching
    # AGENTS.md ("devDependencies bumps — consumers don't see these").
    name: Changeset present when shipping surface changes
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require a changeset
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          CHANGED="$(git diff --name-only "${BASE_SHA}..${HEAD_SHA}")"
          echo "Files changed in this PR:"
          echo "${CHANGED}"

          SHIPPING_CHANGED=0

          # src/ is always shipping surface.
          if echo "${CHANGED}" | grep -Eq '^src/'; then
            SHIPPING_CHANGED=1
          fi

          # For package.json, only count it as shipping if a shipping-relevant
          # key actually changed (not just scripts / devDependencies).
          if echo "${CHANGED}" | grep -q '^package\.json$'; then
            PKG_DIFF="$(git diff "${BASE_SHA}..${HEAD_SHA}" -- package.json)"
            if echo "${PKG_DIFF}" | grep -Eq '^[+-][[:space:]]*"(exports|bin|files|engines|main|types|module|dependencies|peerDependencies|peerDependenciesMeta)"'; then
              SHIPPING_CHANGED=1
            fi
          fi

          if [ "${SHIPPING_CHANGED}" -eq 1 ]; then
            if echo "${CHANGED}" | grep -Eq '^\.changeset/.*\.md$'; then
              echo "OK — shipping surface changed and a changeset is present."
            else
              echo "::error::This PR changes the shipping surface (src/ or a package.json shipping key) but adds no changeset. Run \`npm run changeset\` and commit the generated .changeset/*.md alongside your code."
              exit 1
            fi
          else
            echo "OK — no shipping-surface changes detected; changeset not required."
          fi
