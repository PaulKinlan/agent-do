# tools/gate.conf — the ONE place this repo names the commands its gates run.
#
# Three commands rather than one, for three reasons (~/fleet/docs/speed.md, and docs/speed.md here):
#   STATIC_CMD        metadata check, then type-check and compile. Runs FIRST in both gates, and is the SAME
#                     command in both, so the fast tier stays a strict subset (R2) and no work is done twice
#                     (R8). `npm run build` (tsc, include: src+test+evals) is the same type-check CI runs as
#                     `npm run typecheck`, and it also emits dist/ — which the demos import through
#                     `"agent-do": "file:../../"`, so the emit is load-bearing, not a side effect.
#
#                     `node tools/gen-suite-map.mjs --check` runs FIRST of all, before the build: it is
#                     sub-second, needs no suites, and fails when the committed tools/suite-map.tsv or
#                     tests/coverage-contract.json no longer matches the test import graph. Without it, a
#                     branch that adds an import edge (any refactor, file move or new test helper) is green in
#                     its own fast gate and red only at the merger's FULL gate, because the only test that
#                     enforces the map (tests/gates.test.ts) is selected exactly when the map is NOT stale
#                     (agent-do-s5u, found by agent-do-0fr). Note the boundary: the static step is skipped
#                     entirely when a change selects no suite and no unmapped file (docs-only), which is
#                     correct — a stale map always accompanies a change that does select suites.
#   FAST_GATE_RUNNER  runs ONE suite file per invocation, so the fast gate can run several suites in
#                     PARALLEL PROCESSES. A test file is the unit of parallelism; a run that imports every
#                     test into one process pays every test of wall time (R5).
#   FULL_TIER_CMD     every suite, the deeper tiers included. Runs ONCE per landing, on the merger's merged
#                     union (R1, R11, R13) — never from an implementer lane, which fleet-check refuses.
#                     `npm run eval` is the credential-free mock tier: 1.4 s, and the only thing that
#                     exercises evals/ at all (its own CI job, `npm run eval`).
#
# Values are shell command lines and may contain spaces. Keep them single-line.
# Plain assignments, NOT a shell `${VAR:-default}` form: a value holding a placeholder inside a default
# form is parsed wrong, because the placeholder's own closing brace terminates the expansion first. The two
# scripts instead capture any explicitly exported value BEFORE sourcing this file, which is how a probe
# (`STATIC_CMD=true FAST_GATE_RUNNER=/tmp/stub bash tools/fast-gate.sh`) and tests/gates.test.ts override a
# value without editing a tracked file.
FAST_GATE_RUNNER="npx vitest run"
FULL_TIER_CMD="npm test && npm run eval"
STATIC_CMD="node tools/gen-suite-map.mjs --check && npm run build"
