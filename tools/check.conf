# tools/check.conf — installed as ~/.fleet/check.conf on this project's VM by `bin/fleet new`, by
# tools/install-gate.sh, or by `fleet scaffold`.
#
# `bin/fleet-check` sources this file. Both commands are RELATIVE and run with the working directory set to
# the checkout root. Neither is auto-detected: with this file present, `fleet-check` runs exactly these and
# nothing else. That is the point — an auto-detected gate for a `package.json` project is
# `npm run build && npm test` with NO fast tier at all (~/fleet/bin/fleet-check).
#
# R3 of ~/fleet/docs/speed.md: both gates exist for every repo, even when the full gate is under budget.
# R2: the fast gate is a STRICT SUBSET of the full gate and <= 60 s median; the full gate <= 300 s.
#
# Timeouts are KILL WINDOWS, not budgets: they must exceed the real run (roles/lessons.md, "A gate bound
# must exceed the project real gate runtime"). Measured 2026-10-22 on this project's 2-vCPU VM (nproc 2,
# i.e. half the standard's assumed shape), after agent-do-664 made the worker count actually reach vitest:
# full gate 356 s of gate wall at one worker (313 s at 4, and it stays serial — see docs/speed.md §4), fast
# gate 247.4 s for the widest affected row (43 suites) at the new default of 2 workers, 168 s at 4, 450.8 s
# at one (what it did before the fix). The previous numbers here (full 41.5 s, fast 13.6-55.0 s for 36
# suites) were measured 2026-10-12, before the suite grew and before vitest 4; they are kept in
# docs/speed.md §4 as history rather than repeated as if current.
#
# These bounds are therefore ~2.1x (full) and ~2.9x (fast, against the worst observation) rather than the
# ~11x/~3x they were, and the fast tier is 3-5x over its 60 s budget (R2) on this VM. Loosening the bound is
# not the fix — docs/speed.md §4 names the lever (per-file module import; `--no-isolate` measured 58.5 s for
# the same 43 suites but leaks state between files today) — but a bound that fires on a healthy run is a lie,
# so it is set to the measurement until that lever is pulled. Re-measure and lower it then (speed.md R4).
#
# THE FULL GATE'S WINDOW WAS TOO TIGHT FOR A LOADED VM (agent-do-v3m, 2026-10-26). It was 600 s against a
# worst healthy observation of 563 s — 94% of the window — and on 2026-10-26 it fired twice on runs that were
# healthy: two `fleet-check` full runs on the same tree, killed at 601 s and 616 s with vitest actively
# passing suites in the log tail, while another lane ran a 1587 s build on this 2-vCPU VM. Both came back
# UNKNOWN (INTERRUPTED), which is the one outcome that stops a landing without saying anything about the
# code: `package-lock.json` is deliberately unmapped in the fast tier (docs/speed.md §5), so a lockfile
# change has NO other gate. 1200 s is 2x the window that fired and ~2.1x the worst healthy measurement of
# the quiet VM; the cost of the wider window is only paid when a gate really is wedged (it holds a heavy
# slot for up to 20 min instead of 10, still far inside the reaper's 120 min). It is a kill window, not a
# budget: 600 s of wall for a full gate is still the target, and §4 names the lever that would get there.
CHECK_CMD='bash tools/full-gate.sh'
CHECK_TIMEOUT=1200
CHECK_FAST_CMD='bash tools/fast-gate.sh'
CHECK_FAST_TIMEOUT=480
