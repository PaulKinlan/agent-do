# tools/check.conf — installed as ~/.fleet/check.conf on this project's VM by `bin/fleet new`, by
# tools/install-gate.sh, or by `fleet scaffold`.
#
# `bin/fleet-check` sources this file. Both commands are RELATIVE and run with the working directory set to
# the checkout root. Neither is auto-detected: with this file present, `fleet-check` runs exactly these and
# nothing else. That is the point — an auto-detected gate for a `package.json` project is
# `npm run build && npm test` with NO fast tier at all (~/fleet/bin/fleet-check).
#
# R3 of ~/fleet/docs/speed.md: both gates exist for every repo, even when the full gate is under budget.
# R2: the fast gate is a STRICT SUBSET of the full gate and <= 60 s median; the full gate <= 300 s.
#
# Timeouts are KILL WINDOWS, not budgets: they must exceed the real run (roles/lessons.md, "A gate bound
# must exceed the project real gate runtime"). Measured 2026-10-22 on this project's 2-vCPU VM (nproc 2,
# i.e. half the standard's assumed shape), after agent-do-664 made the worker count actually reach vitest:
# full gate 356 s of gate wall at one worker (313 s at 4, and it stays serial — see docs/speed.md §4), fast
# gate 247.4 s for the widest affected row (43 suites) at the new default of 2 workers, 168 s at 4, 450.8 s
# at one (what it did before the fix). The previous numbers here (full 41.5 s, fast 13.6-55.0 s for 36
# suites) were measured 2026-10-12, before the suite grew and before vitest 4; they are kept in
# docs/speed.md §4 as history rather than repeated as if current.
#
# These bounds are therefore ~3.2x (full, against the worst healthy measurement of 563 s) and ~5.5x (fast,
# against the worst observation: the 327 s contended widest row) rather than the ~11x/~3x they were, and the
# fast tier is 4-8x over its 60 s budget (R2) on this VM (the 247-451 s rows of docs/speed.md §4 — the same
# numbers §4 states; agent-do-mlj: this file and §4 had drifted apart because two landings each edited one
# side). Loosening the bound is
# not the fix — docs/speed.md §4 names the lever (per-file module import; `--no-isolate` measured 58.5 s for
# the same 43 suites but leaks state between files today) — but a bound that fires on a healthy run is a lie,
# so it is set to the measurement until that lever is pulled. Re-measure and lower it then (speed.md R4).
#
# SCALED AGAIN 2026-10-31 (agent-do-ave): 960 s fired twice on one healthy tree — both runs reached the
# 39th of 39 affected suites (the LAST one) before the derived batch bound killed them (614 s and 704 s
# derived from a 286 s / 196 s loaded static step; tests/mcp.test.ts 25/25 green in both tails, nothing
# failed). Same class as v3m below: a bound that fires on a healthy run is a lie, so both windows go to
# the fleet-wide 1800 s bound (~5.5x the worst healthy fast observation, ~3.2x the full one) until the
# speed.md §4 lever is pulled.
#
# THE FULL GATE'S WINDOW WAS TOO TIGHT FOR A LOADED VM (agent-do-v3m, 2026-10-26). It was 600 s against a
# worst healthy observation of 563 s — 94% of the window — and on 2026-10-26 it fired twice on runs that were
# healthy: two `fleet-check` full runs on the same tree, killed at 601 s and 616 s with vitest actively
# passing suites in the log tail, while another lane ran a 1587 s build on this 2-vCPU VM. Both came back
# UNKNOWN (INTERRUPTED), which is the one outcome that stops a landing without saying anything about the
# code: `package-lock.json` is deliberately unmapped in the fast tier (docs/speed.md §5), so a lockfile
# change has NO other gate. 1200 s is 2x the window that fired and ~2.1x the worst healthy measurement of
# the quiet VM; the cost of the wider window is only paid when a gate really is wedged (it holds a heavy
# slot for up to 20 min instead of 10, still far inside the reaper's 120 min). It is a kill window, not a
# budget: the R1 budget (<= 300 s of wall for a full gate, top of this file) is still the target — 600 s was
# itself a missed step toward it (agent-do-mlj) — and §4 names the lever that would get there.
# (2026-10-31, agent-do-ave: 1200 s then fired the same way v3m described — the parked agent-do-dv1 full
# gate was killed twice at 1200 s on a healthy tree — so the full window joins the fast one at 1800 s.)
# THE FAST GATE'S WINDOW WAS TOO TIGHT FOR THIS VM EVEN IN A QUIET WINDOW (agent-do-94b, 2026-10-26).
# CHECK_FAST_TIMEOUT=480 was set against a quiet-VM worst row of 247 s (measured 2026-10-22), but on
# 2026-10-26 it bound-killed FOUR consecutive healthy runs on a docs-only tree (fbf5077): twice inside
# `npm run build` (a full emit measured at 774 s alone — build.mjs deletes the tsbuildinfo on SIGTERM by
# design, so every kill forces a full rebuild next attempt: a doom loop), and twice in the suite phase
# with a warm cache — 39 suites actively running, ZERO failures, killed at 490 s and 482 s. The last kill
# happened in a coord-ordered quiet window (all implementer/specialist lanes idle): background bd/dolt
# sync bursts alone (sync-canonical timer, prune-landed, lane polling) keep this 2-vCPU VM too slow for
# the widest row to fit in 480 s. Quiet windows are not achievable here. 960 s is 2x the window that
# fired (the agent-do-v3m precedent for the full gate) and still far inside the reaper's 120 min; like
# v3m's, it is a KILL WINDOW, not a budget — the 247 s row on a quiet VM stays the target, and the §4
# lever (per-file module import) is still how to get there. Re-measure and lower it when that lands.
# SUITE_BOUND MUST SCALE WITH THE OUTER WINDOW — AND THE SCALING MUST BE MEASURED, NOT GUESSED
# (agent-do-cj6 + agent-do-gmr, both from rev-94b reviewing agent-do-94b; agent-do-a2t on the command form).
# The fast gate runs the static step INSIDE the windowed script before the suite batch, so the batch only
# ever gets CHECK_FAST_TIMEOUT minus whatever the static step consumed. cj6's first fix — a SUITE_BOUND=880
# env prefix here with a constant 80 s reserve — was wrong twice: the reserve was 1-3x below the measured
# warm static step on this VM (58.7 s no-op, 220.4 s partial rebuild — the state every lane is in after a
# pull), so the OUTER window still fired first and healthy loaded runs recorded `unknown`; and the env-prefix
# form escaped fleet-check's missing-target preflight (a config naming a nonexistent gate burned a heavy slot
# instead of being refused). Current shape: CHECK_FAST_CMD stays the bare `bash tools/fast-gate.sh`, and
# fast-gate.sh DERIVES the batch bound at runtime from FAST_OUTER_WINDOW (tools/gate.conf, the mirror of
# CHECK_FAST_TIMEOUT that tests/gates.test.ts pins): window minus the MEASURED static seconds minus a 60 s
# margin (15 s SIGKILL grace + report/marker/teardown), floor 60 s. A batch-bound kill with no report is
# reported `unknown` and exits with the kill code — recorded KILLED, not a verdict (agent-do-c45, landed
# 2026-10-27; the old per-suite `failed:` mapping was a false red). A cold static step (full tsc emit:
# 774-1365 s measured under load) does not fit ANY sane window — that is the build.mjs SIGTERM doom-loop
# noted above; keep the tsbuildinfo warm (probe after a rebase, then gate).
CHECK_CMD='bash tools/full-gate.sh'
CHECK_TIMEOUT=1800
CHECK_FAST_CMD='bash tools/fast-gate.sh'
CHECK_FAST_TIMEOUT=1800
